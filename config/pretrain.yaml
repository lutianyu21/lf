#===============================================================================
# LLMFolding Pretraining Configuration Template
# A self-contained config that doesn't depend on other config files
#===============================================================================

#-------------------------------------------------------------------------------
# Experiment
#-------------------------------------------------------------------------------
name: qwen3-0.6B-dist3-1@pt

#-------------------------------------------------------------------------------
# Dataset
#-------------------------------------------------------------------------------
dataset:
  type: dist3

  # Data paths (override via command line or script)
  train:
    - /SPXvePFS/share/llmfolding/lf/dataset/dataset_dist3-1/folding/unicluster40/train.parquet

  weight:
    - 1.0

  eval:
    - /SPXvePFS/share/llmfolding/lf/dataset/dataset_dist3-1/folding/unicluster40/eval.parquet

  # Data processing
  processing:
    cropping:             True
    masking:              False
    concatenation:        False
    concatenation_ratio:  0.0

#-------------------------------------------------------------------------------
# Language Model
#-------------------------------------------------------------------------------
lm:
  model_type:   qwen3_0.6B
  model_dir:    /SPXvePFS/model/Qwen3-0.6B

#-------------------------------------------------------------------------------
# Trainer
#-------------------------------------------------------------------------------
trainer:
  # Logging
  logging_strategy: steps
  logging_steps: 1
  save_strategy: steps
  save_steps: 1000
  save_total_limit: 10
  report_to: wandb
  output_dir: dummy                   # Will be overwritten by pipe.py
  overwrite_output_dir: True

  # Optimizer
  optim: adamw_torch
  weight_decay: 0.01
  max_grad_norm: 1.0
  max_steps: 50000
  warmup_steps: 10000
  learning_rate: 5e-4
  lr_scheduler_type: polynomial
  lr_scheduler_kwargs:
    lr_end: 1e-5
    power: 1.0

  # Training
  fp16: False
  bf16: True
  gradient_checkpointing: True
  gradient_accumulation_steps: 1
  per_device_train_batch_size: 8
  packing: True
  max_seq_length: 4096
  dataset_text_field: text

  # Evaluation
  per_device_eval_batch_size: 1
  eval_strategy: steps
  eval_steps: 200

#-------------------------------------------------------------------------------
# Hydra
#-------------------------------------------------------------------------------
hydra:
  output_subdir: null
  run:
    dir: .
