type: dist3

train:
  # uniref50 dataset
  - /GenSIvePFS/users/lutianyu/lf/dataset/dataset_dist2/sequence/uniref50/train.parquet
  # unicluster40 structure dataset
  - /GenSIvePFS/users/lutianyu/lf/dataset/dataset_dist3/structure/unicluster40/train.parquet
  # unicluster40 folding dataset
  - /GenSIvePFS/users/lutianyu/lf/dataset/dataset_dist3/folding/unicluster40/train.parquet

weight:
  - 0.2
  - 0.3
  - 0.5

